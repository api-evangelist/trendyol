        address2:
          type: string
        city:
          type: string
        cityCode:
          type: integer
        district:
          type: string
        districtId:
          type: integer
        postalCode:
          type: string
        countryCode:
          type: string
        neighborhoodId:
          type: integer
        neighborhood:
          type: string
        fullName:
          type: string
