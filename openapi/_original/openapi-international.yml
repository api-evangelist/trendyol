                          description: Claim ID
                        claimId:
                          type: string
                          description: Claim ID
                        orderNumber:
                          type: string
                          description: Order number
                        orderDate:
                          type: integer
                          format: int64
                          description: Order date (timestamp)
                        customerFirstName:
                          type: string
                          description: Customer first name
                        customerLastName:
                          type: string
                          description: Customer last name
                        claimDate:
                          type: integer
                          format: int64
                          description: Claim date (timestamp in GMT)
                        cargoTrackingNumber:
                          type: integer
                          format: int64
                          description: Cargo tracking number
                        cargoTrackingLink:
                          type: string
                          description: Cargo tracking link
                        cargoSenderNumber:
                          type: string
                          description: Cargo sender number
                        cargoProviderName:
                          type: string
                          description: Cargo provider name
                        orderShipmentPackageId:
                          type: integer
                          format: int64
                          description: Order shipment package ID
                        replacementOutboundpackageinfo:
                          type: object
                          description: Replacement package info (GULF only - will return empty if there
                            is no replacement)
                          properties:
                            cargoTrackingNumber:
                              type: integer
                              format: int64
                            cargoProviderName:
                              type: string
                            cargoSenderNumber:
                              type: string
                            cargoTrackingLink:
                              type: string
                            packageid:
                              type: integer
                              format: int64
                              description: Replacement packet ID information
                            items:
                              type: array
                              items:
                                type: string
                              description: Array of claim item IDs
                        rejectedpackageinfo:
                          type: object
                          description: Rejected package information (if available)
                          properties:
                            cargoTrackingNumber:
                              type: integer
                              format: int64
                            cargoSenderNumber:
                              type: string
                            cargoProviderName:
                              type: string
                            cargoTrackingLink:
                              type: string
                            packageid:
                              type: integer
                              format: int64
                              description: Rejected return package ID
                            shipmentAddress:
                              type: object
                              properties:
                                address1:
                                  type: string
                                address2:
                                  type: string
                                city:
                                  type: string
                                district:
                                  type: string
                                phone:
                                  type: string
                            items:
                              type: array
                              items:
                                type: string
                              description: Array of claim item IDs
                            dontShipBack:
                              type: boolean
                              description: Indicates that the product should not be shipped back
                        items:
                          type: array
                          description: Array of order line items
                          items:
                            type: object
                            properties:
                              orderLine:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    format: int64
                                  productName:
                                    type: string
                                  barcode:
                                    type: string
                                  merchantSku:
                                    type: string
                                  productColor:
                                    type: string
                                  productSize:
                                    type: string
                                  price:
                                    type: number
                                    format: double
                                  vatBaseAmount:
                                    type: number
                                    format: double
                                  vatRate:
                                    type: number
                                    format: double
                                  salesCampaignId:
                                    type: integer
                                    format: int64
                                  productCategory:
                                    type: string
                              claimItems:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: Claim line item ID
                                    orderLineItemId:
                                      type: integer
                                      format: int64
                                    customerClaimItemReason:
                                      type: object
                                      properties:
                                        name:
                                          type: string
                                        externalReasonId:
                                          type: integer
                                        code:
                                          type: string
                                    trendyolClaimItemReason:
                                      type: object
                                      properties:
                                        name:
                                          type: string
                                        externalReasonId:
                                          type: integer
                                        code:
                                          type: string
                                    claimItemStatus:
                                      type: object
                                      properties:
                                        name:
                                          type: string
                                          description: Status name (Created, WaitingInAction, Accepted,
                                            etc.)
                                    note:
                                      type: string
                                    customerNote:
                                      type: string
                                    resolved:
                                      type: boolean
                                    autoAccepted:
                                      type: boolean
                                      description: Returns which are waiting in actions for 48 hours are
                                        automatically accepted by the system
                                    acceptedBySeller:
                                      type: boolean
                                      description: Returns accepted by the seller
                                    acceptDetail:
                                      type: string
                                      description: SUPPLIER, DISPUTE, or SYSTEM
                        lastModifiedDate:
                          type: integer
                          format: int64
                          description: Last modified date (timestamp)
                        orderOutboundPackageId:
                          type: integer
                          format: int64
                          description: Order outbound package ID
              example:
                totalElements: 2099
                totalPages: 2099
                page: 0
                size: 1
                content:
                - id: f9da2317-876b-4b86-b8f7-0535c3b65731
                  claimId: f9da2317-876b-4b86-b8f7-0535c3b65731
                  orderNumber: '65745805'
