  /order/sellers/{sellerId}/shipment-packages/{packageId}/cargo-providers:
    put:
      tags:
      - Order Integration
      summary: Change Cargo Provider
      description: "This service is used to change the cargo provider of packages. \nCheck package after\
        \ changing using getShipmentPackages service. Can only change from TY Pays model to TY Pays Model.\
        \ \nAvailable for GULF and CEE regions.\n\n**FOR CEE - Trendyol Pays Cargo Providers for Prepaid:**\n\
        - RO (Romania): FANCOURIER, DPD Romania\n\n**FOR CEE - Trendyol Pays Cargo Providers for COD:**\n\
        - RO (Romania): FANCOURIER, DPD Romania\n\n**FOR GULF - Trendyol Pays Cargo Providers for Prepaid:**\n\
        - AE (UAE): Aramex, EMX, J&T, Shipa\n- SA (Saudi Arabia): Aramex, J&T, Shipa, SPL\n\n**FOR GULF\
        \ - Trendyol Pays Cargo Providers for COD:**\n- AE (UAE): Aramex, Shipa\n- SA (Saudi Arabia):\
        \ Aramex, Shipa\n"
      operationId: changeCargoProvider
      parameters:
      - name: sellerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Seller ID
      - name: packageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Package ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cargoProvider
              properties:
                cargoProvider:
                  type: string
                  description: Cargo provider code
                  enum:
                  - Aramex
                  - EMX
                  - J&T
                  - Shipa
                  - SPL
                  - FANCOURIER
                  - DPD Romania
                  example: Aramex
      responses:
        '200':
          description: Successful request. Cargo provider changed successfully.
        '400':
          description: Client error
        '409':
          description: 'Conflict - Cannot change cargo provider. Error codes:

            - **CPE001**: The selected shipping partner is not registered in the system, so the change
            cannot be made.

            - **CPE002**: The shipping partner cannot be changed for this order.

            - **CPE003**: Shipping partner changes are only allowed for marketplace orders.

            - **CPE004**: The selected partner does not deliver to the destination specified in the order,
            so the change cannot be made.

            - **CPE005**: The selected shipping partner is not active in the system, so the change cannot
            be made.

            - **CPE006**: The selected shipping partner cannot be changed. You can contact live support
            for assistance.

            - **CPE007**: This order is not eligible for delivery with the selected shipping partner,
            so the change cannot be made.

            - **RTE003**: You have recently made partner change. You can try the same operation again
            in 5 minutes.

            - **General**: The selected shipping partner cannot be changed. You can contact live support
            for assistance.

            '
        '500':
          description: Internal server error
      security:
      - BasicAuth: []
