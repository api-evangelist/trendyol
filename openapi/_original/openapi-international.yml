  /order/sellers/{sellerId}/claims/{claimId}/issue:
    post:
      tags:
      - Returned Orders Integration - EUROPE
      summary: Reject Returned Orders
      description: 'You can create a rejection request for returned orders in your warehouse.

        You can attach files related to the return (pdf, jpeg, etc.) as "form-data (file)".

        '
      operationId: createClaimIssueEurope
      parameters:
      - name: sellerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Seller ID
      - name: claimId
        in: path
        required: true
        schema:
          type: string
        description: Claim ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - claimIssueReasonId
              - claimItemIdList
              - description
              properties:
                claimIssueReasonId:
                  type: integer
                  format: int64
                  description: Claim issue reason ID
                claimItemIdList:
                  type: string
                  description: Comma-separated list of claim item IDs
                description:
                  type: string
                  maxLength: 500
                  description: Description of the rejection
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Attachments (pdf, jpeg, etc.)
