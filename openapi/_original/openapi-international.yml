  /order/sellers/{sellerId}/claims/create-gulf:
    post:
      tags:
      - Returned Orders Integration - GULF
      summary: Create a Return Request (Created Status)
      description: You can use it to create return request packages for order packages that arrive without
        a return code.
      operationId: createClaimGulf
      parameters:
      - name: sellerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Seller ID
      - name: storeFrontCode
        in: header
        required: true
        schema:
          type: string
        description: Store front code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - claimItems
              - customerId
              - orderNumber
              - shipmentCompanyId
              properties:
                claimItems:
                  type: array
                  items:
                    type: object
                    required:
                    - barcode
                    - quantity
                    - reasonId
                    properties:
                      barcode:
                        type: string
                        description: It is the barcode information of the product in the order.
                        example: string
                      customerNote:
                        type: string
                        description: It is the field written by customers. If you wish, you can feed this
                          field with a text such as "Return without return code".
                        example: string
                      quantity:
                        type: integer
                        description: It is the quantity information of the product you want to create
                          a return request.
                        example: 0
                      reasonId:
                        type: integer
                        description: These are the reasons for return selected by customers on trendyol.com.
                          You can feed this id value as "I give up" with 401 id value for now.
                        example: 401
                customerId:
                  type: integer
                  format: int64
                  description: It is the id value of the customer who take the order on Trendyol.
                  example: 0
                excludeListing:
                  type: boolean
                  description: Exclude from listing
                  example: true
                forcePackageCreation:
                  type: boolean
                  description: Force package creation
                  example: true
                orderNumber:
                  type: string
                  description: The number of the order.
                  example: string
                shipmentCompanyId:
                  type: integer
                  description: You can use the id value of the cargo company you have worked with. Should
                    be 100 as a default.
                  example: 100
            example:
              claimItems:
              - barcode: string
                customerNote: string
                quantity: 0
                reasonId: 401
              customerId: 0
              excludeListing: true
              forcePackageCreation: true
              orderNumber: string
              shipmentCompanyId: 100
      responses:
        '200':
          description: Claim created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  claimId:
                    type: string
                    description: The created claim ID
                  cargoTrackingNumber:
                    type: integer
                    format: int64
                    description: Cargo tracking number for the return
                  claimItemIds:
                    type: array
                    items:
