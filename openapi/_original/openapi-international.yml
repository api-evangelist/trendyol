  /order/sellers/{sellerId}/claims/{claimId}/items/approve-gulf:
    put:
      tags:
      - Returned Orders Integration - GULF
      summary: Approve Returned Orders
      description: In Trendyol system, you can confirm the return orders that are returned to your warehouse
        by means of this method.
      operationId: approveClaimLineItemsGulf
      parameters:
      - name: sellerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Seller ID
      - name: claimId
        in: path
        required: true
        schema:
          type: string
        description: Claim ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - claimLineItemIdList
              properties:
                claimLineItemIdList:
                  type: array
                  items:
                    type: string
                  description: Array of claim line item IDs to approve
                  example:
                  - f9da2317-876b-4b86-b8f7-0535c3b65731
                params:
                  type: object
                  description: Additional parameters
      responses:
        '200':
          description: Claim items approved successfully
        '400':
          description: Client error
        '500':
          description: Internal server error
      security:
      - BasicAuth: []
  /order/sellers/{sellerId}/claims/{claimId}/issue-gulf:
    post:
      tags:
      - Returned Orders Integration - GULF
      summary: Reject Returned Orders
      description: 'You can create a rejection request for returned orders in your warehouse.

        You can attach files related to the return (pdf, jpeg, etc.) as "form-data (file)".

        '
      operationId: createClaimIssueGulf
      parameters:
      - name: sellerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Seller ID
      - name: claimId
        in: path
        required: true
        schema:
          type: string
        description: Claim ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - claimIssueReasonId
              - claimItemIdList
              - description
              properties:
                claimIssueReasonId:
                  type: integer
                  format: int64
                  description: Claim issue reason ID
                claimItemIdList:
                  type: string
                  description: Comma-separated list of claim item IDs
                description:
                  type: string
                  maxLength: 500
                  description: Description of the rejection
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Attachments (pdf, jpeg, etc.)
      responses:
        '200':
          description: Claim issue created successfully
        '400':
          description: Client error
        '500':
          description: Internal server error
      security:
      - BasicAuth: []
  /order/claim-issue-reasons-gulf:
    get:
      tags:
      - Returned Orders Integration - GULF
      summary: Claim Issue Reasons
      description: You can access the claimIssueReasonId value to be sent to the createClaimIssue service
        by using this service.
      operationId: getClaimsIssueReasonsGulf
      parameters:
      - name: storeFrontCode
        in: header
        required: true
        schema:
          type: string
        description: Store front code
      responses:
        '200':
          description: Successful response with array of claim issue reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Reason ID
                    name:
                      type: string
                      description: Reason name
              example:
              - id: 51
                name: The product received from the customer was used
              - id: 201
                name: The product received from the customer is wrong
              - id: 251
                name: The product received from the customer is defective/damaged
              - id: 401
                name: The product quantity received from the customer is missing
              - id: 151
                name: The product received from the customer is missing an accessory/part
              - id: 1651
                name: I did not receive the return package sent by the customer
              - id: 2201
                name: The item I sent is not missing
              - id: 1751
                name: The item I sent is not defective
              - id: 1701
                name: The item I sent is not incorrect
              - id: 2151
                name: I will send the invoice for the customer to get support from technical service
        '400':
          description: Client error
        '500':
          description: Internal server error
      security:
      - BasicAuth: []
  /order/sellers/{sellerId}/shipment-packages/{packageId}/tracking-details-rejected-gulf:
    put:
      tags:
      - Returned Orders Integration - GULF
      summary: Rejected Package Update Tracking Number
      description: This method should be use to notify Trendyol to the order's package tracking number.
      operationId: updateRejectedTrackingNumberGulf
      parameters:
      - name: sellerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Seller ID
      - name: packageId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Package ID
      - name: storeFrontCode
        in: header
        required: true
        schema:
          type: string
        description: Store front code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cargoSenderNumber
              - providerCode
              properties:
                cargoSenderNumber:
                  type: string
                  description: Cargo sender number
                providerCode:
                  type: string
                  description: Provider code
            example:
              cargoSenderNumber: '1111111111'
              providerCode: DHLMP
      responses:
        '200':
          description: HTTP 200
        '400':
          description: Client error
        '500':
          description: Internal server error
      security:
      - BasicAuth: []
  /order/sellers/{sellerId}/claims/items/{claimItemsId}/audit-gulf:
    get:
      tags:
      - Returned Orders Integration - GULF
      summary: Get Claim Audit Information
      description: With this service, you can check the status progress of the returned order, the update
        date, the person who made the transaction.
      operationId: getClaimAuditsGulf
      parameters:
      - name: sellerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Seller ID
      - name: claimItemsId
        in: path
        required: true
        schema:
          type: string
        description: Claim item ID
      - name: storeFrontCode
        in: header
        required: true
        schema:
          type: string
        description: Store front code
      responses:
        '200':
          description: Successful response with array of audit records
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    claimId:
                      type: string
                      description: Claim ID
                    claimItemId:
                      type: string
                      description: Claim item ID
                    previousStatus:
                      type: string
                      description: Previous status (empty string for first status)
                    newStatus:
                      type: string
                      description: New status
                    userInfoDocument:
                      type: object
                      description: Information about who made the transaction
                      properties:
                        executorId:
                          type: string
                          description: Executor ID
                        executorApp:
                          type: string
                          description: Application that made the change (SellerIntegrationApi or Seller
                            Center Orders BFF)
                        executorUser:
                          type: string
                          description: User email who made the action
                    date:
                      type: integer
                      format: int64
                      description: Update date (timestamp)
              example:
              - claimId: 6101ceca-1743-4d4e-bad2-d476c22542ca
                claimItemId: f369b0a2-1461-4c9c-b3cc-12824d65e5e6
                previousStatus: ''
