  /order/sellers/{sellerId}/claims-gulf:
    get:
      tags:
      - Returned Orders Integration - GULF
      summary: Getting Returned Orders
      description: This method enables you to retrieve information about returned orders from the Trendyol
        system.
      operationId: getClaimsGulf
      parameters:
      - name: sellerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Seller ID
      - name: storeFrontCode
        in: header
        required: true
        schema:
          type: string
        description: Store front code
      - name: claimIds
        in: query
        required: false
        schema:
          type: string
        description: See details of specific claim packages (comma separated)
      - name: claimItemStatus
        in: query
        required: false
        schema:
          type: string
          enum:
          - Created
          - WaitingInAction
          - Accepted
          - Cancelled
          - Rejected
          - Unresolved
          - InAnalysis
        description: Filter by claim status
      - name: startDate
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Start date (timestamp)
      - name: endDate
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: End date (timestamp)
      - name: orderNumber
        in: query
        required: false
        schema:
          type: string
        description: The order number of the claim package
      - name: page
        in: query
        required: false
        schema:
          type: integer
