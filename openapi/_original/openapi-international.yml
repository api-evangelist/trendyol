  /order/sellers/{sellerId}/orders/stream:
    get:
      tags:
      - Order Integration
      summary: Get Shipment Packages via Stream - getShipmentPackagesStream
      description: 'You can retrieve shipment packages for orders placed by customers using cursor-based
        pagination.

        This method provides a more efficient and reliable way to fetch order packages compared to traditional
        page-number-based pagination.

        Data is returned in a fixed sort order: lastModifiedDate newest to oldest (DESC).

        The content array contains the same shipment package structure as the getShipmentPackages endpoint.

        '
      operationId: getShipmentPackagesStream
      parameters:
      - name: sellerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Seller ID
      - name: storeFrontCode
        in: header
        required: true
        schema:
          type: string
        description: Store front code. Works the same way as the existing getShipmentPackages service.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 200
        description: Maximum number of packages to return per request (default 50, maximum 200)
      - name: nextCursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque token used to fetch the next page. Must not be sent in the first request.
          Use the nextCursor value from the response as-is.
      - name: packageItemStatuses
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by package item statuses. Multiple statuses can be sent separated by commas.

          Valid values: Created, Picking, Invoiced, Shipped, Cancelled, Delivered, UnDelivered, Returned,
          UnSupplied, AtCollectionPoint, UnPacked, Awaiting

          '
      - name: lastModifiedStartDate
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Fetch packages modified after this date (Unix timestamp in milliseconds)
      - name: lastModifiedEndDate
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Fetch packages modified before this date (Unix timestamp in milliseconds)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
