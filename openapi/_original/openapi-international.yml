servers:
- url: https://apigw.trendyol.com/integration
  description: Production Environment
- url: https://stageapigw.trendyol.com/integration
  description: Stage Environment
tags:
- name: Order Integration
  description: Order package management and delivery operations
- name: Split Order Package
  description: Package splitting operations
- name: Shipping Alternative Delivery
  description: Alternative delivery methods for GULF region
- name: Returned Orders Integration - EUROPE
  description: Return operations and management for Europe (CEE) region. Note GULF and EUROPE regions
    use the same API endpoints, differentiated by the storeFrontCode header parameter.
- name: Returned Orders Integration - GULF
  description: Return operations and management for GULF region. Note GULF and EUROPE regions use the
    same API endpoints, differentiated by the storeFrontCode header parameter. The path suffixes shown
    here are for documentation organization only.
paths:
  /order/sellers/{sellerId}/orders:
    get:
      tags:
      - Order Integration
      summary: Get Shipment Packages
      description: This method allows you to retrieve information about each customer order for the products
        you have listed on the Trendyol system. Maximum of 1000 requests per minute. Can query up to three
        months retrospectively.
      operationId: getShipmentPackages
      parameters:
      - name: sellerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Seller ID
      - name: storeFrontCode
        in: header
        required: true
        schema:
          type: string
        description: Store front code
      - name: startDate
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Start date (Unix timestamp in milliseconds)
      - name: endDate
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: End date (Unix timestamp in milliseconds)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 200
        description: Page size (maximum 200)
      - name: orderNumber
        in: query
        required: false
        schema:
          type: string
        description: Filter by order number
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Created
          - Picking
          - Invoiced
          - Shipped
          - Cancelled
          - Delivered
          - UnDelivered
          - Returned
          - AtCollectionPoint
          - UnSupplied
          - Awaiting
        description: Filter by package status
      - name: orderByField
        in: query
        required: false
        schema:
          type: string
          enum:
          - PackageLastModifiedDate
        description: Order by field
      - name: orderByDirection
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
        description: Order direction (ASC for old to new, DESC for new to old)
      - name: shipmentPackageIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
        description: Filter by specific shipment package IDs
      responses:
