openapi: 3.0.3
info:
  title: Global Center Gateway API
  description: 'Trendyol Global Center Gateway API - API services used for international e-export integration.


    This API is used to manage product offers, stocks, and orders in global markets.


    ## Required HTTP Header Fields

    The following headers must be sent with all requests:


    | Header | Type | Description |

    |--------|------|-------------|

    | x-correlationid | string (UUID) | Unique UUIDv4 value for each request |

    | x-agentname | string | Client/integrator name making the request |

    | Authorization | string | Basic Auth token |


    ## Error Codes


    | Code | Description |

    |------|-------------|

    | 1001 | An unexpected error occurred. Please contact us |

    | 1002 | Required fields are missing |

    | 1003 | An unexpected error occurred. Please contact us |

    | 1004 | Invalid parameter entered |

    | 1005 | Invalid JSON format |

    | 1006 | You are not authorized to send this request |

    | 1007 | Request timed out |

    | 2001 | Invalid VariantID |

    | 2002 | Insufficient stock |

    | 2003 | Invalid OrderId |

    | 2004 | This variant cannot be cancelled |

    | 2005 | B2B has not been created for this Vendor Ref yet |

    | 2006 | Invalid b2bId |

    | 2007 | Invalid PartnerId |

    | 2008 | Invalid OrderId |

    | 2009 | This variant cannot be cancelled |

    '
  version: 1.0.0
  contact:
    name: Trendyol Global Platform Support
    email: globalplatform@trendyol.com
  x-source-url: https://dash.readme.com/api/v1/api-registry/c4c15ml67qlde
  x-documentation-url: https://developers.trendyol.com/docs/getting-started
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
servers:
- url: https://apigw.trendyol.com/integration/exportcentergw
  description: Production Environment
- url: https://stageapigw.trendyol.com/integration/exportcentergw
  description: Stage Environment
tags:
- name: Offers
  description: Product offers and content media operations
- name: Stocks
  description: Stock query operations
- name: Orders
  description: Order creation, cancellation, and query operations
paths:
  /v1/offers:
    get:
      tags:
      - Offers
      summary: Get Offers
      description: 'Lists product offers. Provides access to product information with various filters.


        Filtering parameters are optional and can be used together.

        '
      operationId: gcgw-get-offers
      parameters:
      - name: modelNo
        in: query
        required: false
        schema:
          type: string
        description: Model code that groups variants. Maximum 100 items
        example: TWOSS22EL00791
      - name: variantIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          maxItems: 100
        description: Unique number identifying the product. Maximum 100 items
        example:
        - '482858333'
      - name: barcodes
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Product barcode
        example:
        - '8682165254195'
      - name: lastModifiedDateFrom
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Last modification date start (RFC3339 format)
        example: '2022-08-22T12:00:29Z'
      - name: lastModifiedDateTo
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Last modification date end (RFC3339 format)
        example: '2022-08-22T12:02:29Z'
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
        description: Number of records per page
        example: 20
      - name: pageKey
        in: query
        required: false
        schema:
          type: string
        description: Next page key
        example: '1'
      - name: tags
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Search by tags (can be multiple)
        example:
        - bestSeller
      - name: language
        in: query
        required: false
        schema:
          type: string
          enum:
          - EN
          - TR
          - PL
          - AR
          - DE
          - FR
          - NL
        description: Language code
        example: EN
      - name: active
        in: query
        required: false
        schema:
          type: boolean
        description: Are offers active?
        example: true
      - name: brandId
        in: query
        required: false
        schema:
          type: integer
        description: Brand ID (e.g., 40 = TrendyolMilla)
        example: 40
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffersResponse'
              example:
                offers:
                - variantId: '482858333'
                  modelNo: TWOSS22EL00791
                  barcode: '8682165254195'
                  title: Green Basic Knit T-Shirt
                  description: Basic cut knit t-shirt
                  brandId: 40
                  brandName: TrendyolMilla
                  categoryId: 1234
                  categoryName: T-Shirt
                  gender: Women
                  color: Green
                  size: M
                  attributes:
                  - name: Fabric
                    value: Cotton
                  - name: Fit
                    value: Regular
                  prices:
                    listPrice: 199.99
                    salePrice: 149.99
                    currency: EUR
                  images:
                  - url: https://cdn.dsmcdn.com/ty517/product/media/images/example.jpg
                    order: 1
                  active: true
                  tags:
                  - bestSeller
                  lastModifiedDate: '2022-08-22T12:01:00Z'
                pageKey: '2'
                totalCount: 150
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/offers/content-medias:
    get:
      tags:
      - Offers
      summary: Get Offer Content Medias
      description: 'Retrieves media content (images, size charts, etc.) for product offers.


        Queries media information by Content IDs.

        '
      operationId: gcgw-get-offer-content-medias
      parameters:
      - name: contentIds
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
        description: Unique number that groups variants
        example:
        - '302684358'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentMediasResponse'
              example:
                content_medias:
                - content_id: '302684358'
                  sizeCharts:
                    de: https://cdn.dsmcdn.com/ty596/product/charts/languages/tr/categories/2962/brands/1262112/dd2b3197.jpg
                    en: https://cdn.dsmcdn.com/ty596/product/charts/languages/tr/categories/2962/brands/1262112/dd2b3198.jpg
                    tr: https://cdn.dsmcdn.com/ty596/product/charts/languages/tr/categories/2962/brands/1262112/dd2b3199.jpg
                  medias:
                  - order: 1
                    is_hidden: false
                    is_human: true
                    url: https://cdn.dsmcdn.com/ty516/product/media/images/20220824/14/165032750/482058333/2/2_org_zoom.jpg
                    url_size_2000_x_2000: https://media-center-image-processor-s3.s3.eu-central-1.amazonaws.com/GP/ty516/product/media/images/example_2000x2000.jpg
                    url_white_bg: ''
                    url_size_1500_x_2000: https://media-center-image-processor-s3.s3.eu-central-1.amazonaws.com/GP/ty516/product/media/images/example_1500x2000.jpg
                  - order: 2
                    is_hidden: false
                    is_human: true
                    url: https://cdn.dsmcdn.com/ty517/product/media/images/20220824/14/165032750/482058333/3/3_org_zoom.jpg
                    url_size_2000_x_2000: https://media-center-image-processor-s3.s3.eu-central-1.amazonaws.com/GP/ty517/product/media/images/example2_2000x2000.jpg
                    url_white_bg: ''
                    url_size_1500_x_2000: https://media-center-image-processor-s3.s3.eu-central-1.amazonaws.com/GP/ty517/product/media/images/example2_1500x2000.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/stocks:
    get:
      tags:
      - Stocks
      summary: Get Stocks
      description: 'Retrieves stock information for specified variant IDs.


        Stock information is shown separately for Trendyol and seller warehouses.

        '
      operationId: gcgw-get-stocks
      parameters:
      - name: variantIds
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          maxItems: 20
        description: Variant ID list. Maximum 20 items
        example:
        - '166158629'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockInfo'
              example:
              - variantId: '166158629'
                availableQuantity: 20
                warehouses:
                  trendyol:
                    quantity: 13
                  seller:
                    quantity: 7
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                modelValidation:
                  summary: Model Validation Exception
                  value:
                    status: 400
                    type: ModelValidationException
                    traceId: '312321312321312312'
                    error:
                      code: 1002
                      title: Error
                      detail: 'Validation failed for request: {VariantIds:[]}, with error: VariantIds
                        is a required field'
                stockNotAvailable:
                  summary: Stock Not Available Exception
                  value:
                    status: 400
                    type: StockNotAvailableException
                    traceId: 18ba3be2-e6c0-413e-91eb-fb7c05573bd9
                    error:
                      code: 2002
                      title: Error
                      detail: 'Stock not available for some variants, errorMessages : [Stock Not Available
                        for VariantId: 69128041, WarehouseTag: null.]'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/orders:
    post:
      tags:
      - Orders
      summary: Create Order
      description: 'Creates a new order.


        **Important Notes:**

        - Items array can contain maximum 100 products

        - requestedQuantity must be greater than 0

        - vendorRef must be in unique UUIDv4 format for each order

        '
      operationId: gcgw-create-order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              items:
              - variantId: '166158629'
                requestedQuantity: 10
              - variantId: '166158630'
                requestedQuantity: 5
              vendorRef: fdaf6307-4409-4398-a326-61378b2b4bb2
              addressTitle: yourAddressTitle
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
              example:
                items:
                - cancelable: true
                  lineItems:
                  - cancelable: true
                    quantity: 15
                    warehouseType: warehouseType
                  quantity: 15
                  variantId: '166158629'
                createDateTime: '2022-09-27T11:11:26.4099061Z'
                orderNumber: '20001234234'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                type: ModelValidationException
                traceId: '312321312321312312'
                error:
                  code: 1002
                  title: Error
                  detail: 'Validation failed for request: {VendorRef:Not UUID V4 Items:[{VariantId:1001
                    RequestedQuantity:0} {VariantId:testVariantId RequestedQuantity:0}]}, with error:
                    VendorRef must be a valid version 4 UUID, RequestedQuantity must be greater than 0'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/orders/{orderNumber}/cancel:
    post:
      tags:
      - Orders
      summary: Cancel Order
      description: 'Cancels an existing order or specific products within an order.


        **Important Notes:**

        - Items array can contain maximum 100 products

        - quantity specifies the quantity to be cancelled

        - Only products in cancellable status can be cancelled

        '
      operationId: gcgw-cancel-order
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: string
        description: Order number to be cancelled
        example: 7e871bf9-de1a-4f4c-b1f5-443e77231fb0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
            example:
              items:
              - quantity: 2
                variantId: '482858333'
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                type: object
              example: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                orderNotSuitable:
                  summary: Order Status Not Suitable
                  value:
                    status: 400
                    type: OrderNotSuitableForCancelException
                    traceId: f3a72afa-e829-419b-b6aa-5ad715295ddd
                    error:
                      code: 2004
                      title: Error
                      detail: 'Order not suitable for cancel these variantIds : [string]'
                orderNotFound:
                  summary: Order Not Found
                  value:
                    status: 404
                    type: OrderNotFoundException
                    traceId: c44c2de5-5af6-4012-b761-5564653e1ffd
                    error:
                      code: 2003
                      title: Error
                      detail: 'Order not found for orderId : 32423423423'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/orders/vendorRefs/{B2BId}:
    get:
      tags:
      - Orders
      summary: Get VendorRefs By B2BId
      description: 'Retrieves the VendorRef list for the specified B2B ID.


        This endpoint returns all order references associated with a B2B ID.

        '
      operationId: gcgw-get-vendor-refs-by-b2b-id
      parameters:
      - name: B2BId
        in: path
        required: true
        schema:
          type: integer
        description: B2B ID number
        example: 1001
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorRefsByB2BIdResponse'
              example:
                b2BId: 1001
                invoiceNumber: INT2022000000001
                vendorRefSummaries:
                - orderId: orderId1
                  vendorRef: vendorRef1
                  creationDate: '2022-09-27T11:11:26Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                type: StatusBadRequest
                traceId: ''
                error:
                  code: 0
                  title: ''
                  detail: b2bId not valid
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/orders/{vendorRef}/b2bs:
    get:
      tags:
      - Orders
      summary: Get B2Bs By VendorRef
      description: 'Retrieves the B2B list for the specified VendorRef.


        This endpoint returns all B2B information associated with a VendorRef.

        '
      operationId: gcgw-get-b2bs-by-vendor-ref
      parameters:
      - name: vendorRef
        in: path
        required: true
        schema:
          type: string
        description: Vendor reference code
        example: vendorRef1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2BsByVendorRefResponse'
              example:
                vendorRef: vendorRef1
                b2bSummaries:
                - b2BId: b2BId1
                  invoiceNumber: INT2022000000001
                  warehouseId: warehouseId1
                  warehouseName: warehouseName1
                  createDate: '2022-09-27T11:11:26Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                type: StatusBadRequest
                traceId: ''
                error:
                  code: 0
                  title: ''
                  detail: vendorRef not found
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic Auth with API Key and Secret
  responses:
    BadRequest:
      description: Bad Request - Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            type: HttpClientApiCallException
            traceId: ''
            error:
              code: 1003
              title: Error
              detail: Your request could not be success
    Unauthorized:
      description: Unauthorized - Authentication error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            type: UnauthorizedException
            traceId: ''
            error:
              code: 1006
              title: Error
              detail: You are not authorized to send this request
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
        type:
          type: string
          description: Error type
        traceId:
          type: string
          description: Trace ID
        error:
          type: object
          properties:
            code:
              type: integer
              description: Error code
            title:
              type: string
              description: Error title
            detail:
              type: string
              description: Error detail
    OffersResponse:
      type: object
      properties:
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
        pageKey:
          type: string
          description: Next page key
        totalCount:
          type: integer
          description: Total record count
    Offer:
      type: object
      properties:
        variantId:
          type: string
          description: Variant ID
        modelNo:
          type: string
          description: Model number
        barcode:
          type: string
          description: Barcode
        title:
          type: string
          description: Product title
        description:
          type: string
          description: Product description
        brandId:
          type: integer
          description: Brand ID
        brandName:
          type: string
          description: Brand name
        categoryId:
          type: integer
          description: Category ID
        categoryName:
          type: string
          description: Category name
        gender:
          type: string
          description: Gender
        color:
          type: string
          description: Color
        size:
          type: string
          description: Size
        attributes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
        prices:
          type: object
          properties:
            listPrice:
              type: number
              format: double
              description: List price
            salePrice:
              type: number
              format: double
              description: Sale price
            currency:
              type: string
              description: Currency
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                description: Image URL
              order:
                type: integer
                description: Order
        active:
          type: boolean
          description: Is active
        tags:
          type: array
          items:
            type: string
          description: Tags
        lastModifiedDate:
          type: string
          format: date-time
          description: Last modified date
    ContentMediasResponse:
      type: object
      properties:
        content_medias:
          type: array
          items:
            $ref: '#/components/schemas/ContentMedia'
    ContentMedia:
      type: object
      properties:
        content_id:
          type: string
          description: Content ID
        sizeCharts:
          type: object
          description: Size chart URLs by language
          additionalProperties:
            type: string
        medias:
          type: array
          items:
            $ref: '#/components/schemas/Media'
    Media:
      type: object
      properties:
        order:
          type: integer
          description: Image order
        is_hidden:
          type: boolean
          description: Is hidden
        is_human:
          type: boolean
          description: Has human model
        url:
          type: string
          description: Original image URL
        url_size_2000_x_2000:
          type: string
          description: 2000x2000 sized image URL
        url_white_bg:
          type: string
          description: White background image URL
        url_size_1500_x_2000:
          type: string
          description: 1500x2000 sized image URL
    StockInfo:
      type: object
      properties:
        variantId:
          type: string
          description: Variant ID
        availableQuantity:
          type: integer
          description: Total available stock
        warehouses:
          type: object
          properties:
            trendyol:
              type: object
              properties:
                quantity:
                  type: integer
                  description: Stock in Trendyol warehouse
            seller:
              type: object
              properties:
                quantity:
                  type: integer
                  description: Stock in seller warehouse
    CreateOrderRequest:
      type: object
      required:
      - items
      - vendorRef
      properties:
        items:
          type: array
          maxItems: 100
          description: Order items (maximum 100)
          items:
            type: object
            required:
            - variantId
            - requestedQuantity
            properties:
              variantId:
                type: string
                description: Variant ID
              requestedQuantity:
                type: integer
                minimum: 1
                description: Requested quantity (must be greater than 0)
              warehouseTag:
                type: string
                description: Warehouse tag (optional)
        vendorRef:
          type: string
          format: uuid
          description: Unique UUIDv4 reference code for each order
        addressTitle:
          type: string
          description: Address title (optional, used for communication with account manager)
    CreateOrderResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              cancelable:
                type: boolean
                description: Is cancelable
              lineItems:
                type: array
                items:
                  type: object
                  properties:
                    cancelable:
                      type: boolean
                    quantity:
                      type: integer
                    warehouseType:
                      type: string
              quantity:
                type: integer
                description: Total quantity
              variantId:
                type: string
                description: Variant ID
        createDateTime:
          type: string
          format: date-time
          description: Order creation time
        orderNumber:
          type: string
          description: Order number
    CancelOrderRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          description: Products to be cancelled (maximum 100)
          items:
            type: object
            required:
            - quantity
            - variantId
            properties:
              quantity:
                type: integer
                minimum: 1
                description: Quantity to be cancelled
              variantId:
                type: string
                description: Variant ID of the product to be cancelled
    VendorRefsByB2BIdResponse:
      type: object
      properties:
        b2BId:
          type: integer
          description: B2B ID
        invoiceNumber:
          type: string
          description: Invoice number
        vendorRefSummaries:
          type: array
          items:
            type: object
            properties:
              orderId:
                type: string
                description: Order ID
              vendorRef:
                type: string
                description: Vendor reference code
              creationDate:
                type: string
                format: date-time
                description: Creation date
    B2BsByVendorRefResponse:
      type: object
      properties:
        vendorRef:
          type: string
          description: Vendor reference code
        b2bSummaries:
          type: array
          items:
            type: object
            properties:
              b2BId:
                type: string
                description: B2B ID
              invoiceNumber:
                type: string
                description: Invoice number
              warehouseId:
                type: string
                description: Warehouse ID
              warehouseName:
                type: string
                description: Warehouse name
              createDate:
                type: string
                format: date-time
                description: Creation date
security:
- basicAuth: []
