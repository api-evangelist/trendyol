name: Trendyol
description: >-
  Trendyol is Turkey's largest e-commerce marketplace and a leading fashion and
  retail platform operating across Türkiye, the Gulf, Azerbaijan, and Central &
  Eastern Europe. Its Marketplace (Partner) API lets sellers and integrators
  manage the full commerce lifecycle: product catalog with category/brand/
  attribute data, price and stock updates, order and shipment-package
  fulfillment, returns and claims, invoicing, settlements and financial
  reconciliation, the Export Center, customer questions, and order webhooks.
  Authentication is HTTP Basic (API key/secret) with a mandatory User-Agent
  header, plus an OAuth 2.0 authorization-code flow for multi-supplier
  integrators. Bulk writes are asynchronous and confirmed via a batchRequestId.
